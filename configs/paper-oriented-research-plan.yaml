# Planning-only research target. `deepalm plan` resolves this contract, but the
# public runner intentionally does not present a completed paper-scale run.
# Replace the public Reference Bank and market inputs only in the bank-controlled
# environment that will own the resulting evidence.
source_data:
  snb_csv: data/snb-data-rendopar-en-all_19880401-20250731.csv
  paper_pdf: docs/Deep treasury management for banks.pdf
  nss_beta_unit: percentage_points

workflow_contract:
  name: paper-oriented-research-plan

execution_profile:
  name: paper-research

run_scale:
  profile: paper_scale

architecture:
  profile: paper

reference_bank:
  profile: canonical
  initial_assets:
    value: 10000
    unit: mCHF

experiment:
  horizons_years: [5, 15]
  include_swaps: false

policy:
  names: [BM^E, BM^C, BM^D, MM]

optimization:
  device: cpu
  dtype: float64

resources:
  wall_clock_budget_seconds: 86400
  process_rss_limit_bytes: 34359738368
  accelerator_memory_limit_bytes: 34359738368

seeds:
  market_scenarios: 20260907
  objective_parameters: 20260908
  model_initialization: 20260909
  data_loader_order: 20260910
  bootstrap: 20260911
  sensitivity: 20260912

output:
  directory: artifacts
  run_name: paper-oriented-research-plan

acceptance:
  purpose: research
  required_status: methodologically-reproduced
